<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product CRUD Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 font-sans antialiased">

    <div class="flex h-screen overflow-hidden">
        
        <!-- SIDEBAR -->
        <aside class="hidden md:flex flex-col w-64 bg-indigo-900 text-white">
            <div class="flex items-center justify-center h-20 shadow-md">
                <h1 class="text-2xl font-bold tracking-wider">Admin<span class="text-indigo-400">Panel</span></h1>
            </div>
            <nav class="flex-1 px-4 py-6 space-y-2">
                <a href="#" class="flex items-center px-4 py-3 text-gray-300 hover:bg-indigo-800 rounded-lg transition">
                    <i class="fa-solid fa-house w-6"></i> Dashboard
                </a>
                <a href="#" class="flex items-center px-4 py-3 bg-indigo-800 text-white rounded-lg transition">
                    <i class="fa-solid fa-box w-6"></i> Products
                </a>
                <a href="#" class="flex items-center px-4 py-3 text-gray-300 hover:bg-indigo-800 rounded-lg transition">
                    <i class="fa-solid fa-users w-6"></i> Customers
                </a>
                <a href="#" class="flex items-center px-4 py-3 text-gray-300 hover:bg-indigo-800 rounded-lg transition">
                    <i class="fa-solid fa-gear w-6"></i> Settings
                </a>
            </nav>
        </aside>

        <!-- MAIN CONTENT AREA -->
        <div class="flex flex-col flex-1 h-full overflow-hidden">
            
            <!-- TOP NAVBAR -->
            <header class="flex items-center justify-between h-20 px-6 bg-white border-b border-gray-200">
                <div class="flex items-center">
                    <button class="text-gray-500 focus:outline-none md:hidden">
                        <i class="fa-solid fa-bars text-xl"></i>
                    </button>
                    <h2 class="text-xl font-semibold text-gray-800 ml-4 md:ml-0">Product Management</h2>
                </div>
                <div class="flex items-center space-x-4">
                    <span class="text-sm font-medium text-gray-600">Admin User</span>
                    <div class="w-10 h-10 bg-indigo-600 rounded-full flex items-center justify-center text-white font-bold">AU</div>
                </div>
            </header>

            <!-- PAGE CONTENT -->
            <main class="flex-1 overflow-x-hidden overflow-y-auto bg-gray-50 p-6">
                
            
              
            </main>
        </div>
    </div>


</body>
</html>
